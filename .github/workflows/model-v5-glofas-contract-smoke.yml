name: Model v5 GloFAS Contract Smoke

on:
  push:
    branches: [model-v5-operational-native]
    paths:
      - "validation/model_v5_glofas_smoke_trigger.txt"
      - ".github/workflows/model-v5-glofas-contract-smoke.yml"

permissions:
  contents: write

env:
  EWDS_API_KEY: ${{ secrets.EWDS_API_KEY }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'cdsapi>=0.7.6,<0.8' requests
      - name: Inspect EWDS process schema and probe accepted reference dates
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import cdsapi, requests

          base = 'https://ewds.climate.copernicus.eu/api'
          key = os.environ['EWDS_API_KEY']
          if not key:
              raise SystemExit('EWDS_API_KEY missing')

          schema_url = base + '/retrieve/v1/processes/cems-glofas-reforecast'
          r = requests.get(schema_url, timeout=60)
          schema_capture = {
              'status_code': r.status_code,
              'url': schema_url,
              'text_prefix': r.text[:30000],
          }
          try:
              schema_capture['json'] = r.json()
          except Exception:
              pass
          Path('validation/model_v5_glofas_process_schema.json').write_text(json.dumps(schema_capture, indent=2))

          client = cdsapi.Client(url=base, key=key)
          valid_2024_jan_days = ['01','04','08','11','15','18','22','25','29']
          day_results = {}
          for day in valid_2024_jan_days:
              target = Path(f'/tmp/glofas_probe_2022_01_{day}.zip')
              request = {
                  'system_version': ['version_4_0'],
                  'hydrological_model': ['lisflood'],
                  'product_type': ['control_reforecast'],
                  'variable': ['river_discharge_in_the_last_24_hours'],
                  'hyear': ['2022'],
                  'hmonth': ['01'],
                  'hday': [day],
                  'leadtime_hour': ['24','48','72'],
                  'area': [13.0, 5.0, 4.0, 11.0],
                  'data_format': 'grib2',
                  'download_format': 'zip',
              }
              try:
                  client.retrieve('cems-glofas-reforecast', request).download(str(target))
                  day_results[day] = {'ok': True, 'bytes': target.stat().st_size}
              except Exception as exc:
                  day_results[day] = {'ok': False, 'error': str(exc)[:1500]}
              print(day, day_results[day])

          Path('validation/model_v5_glofas_contract_smoke.json').write_text(json.dumps({
              'dataset': 'cems-glofas-reforecast',
              'system_version': 'version_4_0',
              'probe_hyear': 2022,
              'probe_hmonth': '01',
              'reference_year_for_day_schedule': 2024,
              'lead_hours': [24,48,72],
              'day_results': day_results,
          }, indent=2))
          PY
      - name: Persist schema and probe result
        if: always()
        run: |
          test -f validation/model_v5_glofas_process_schema.json || exit 1
          test -f validation/model_v5_glofas_contract_smoke.json || exit 1
          git config user.name "naijaclimaguard-model-v5-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/model_v5_glofas_process_schema.json validation/model_v5_glofas_contract_smoke.json
          git diff --cached --quiet && exit 0
          git commit -m "model-v5: record EWDS GloFAS schema and date probe"
          git pull --rebase origin model-v5-operational-native
          git push origin HEAD:model-v5-operational-native
