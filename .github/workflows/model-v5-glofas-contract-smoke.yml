name: Model v5 GloFAS Contract Smoke

on:
  workflow_dispatch:
  push:
    branches: [model-v5-operational-native]
    paths:
      - "validation/model_v5_glofas_smoke_trigger.txt"
      - ".github/workflows/model-v5-glofas-contract-smoke.yml"

permissions:
  contents: write

env:
  EWDS_API_KEY: ${{ secrets.EWDS_API_KEY }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'cdsapi>=0.7.6,<0.8' requests
      - name: Probe fixed-day and current-version GloFAS contracts
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import cdsapi, requests

          base = 'https://ewds.climate.copernicus.eu/api'
          key = os.environ['EWDS_API_KEY']
          schema_url = base + '/retrieve/v1/processes/cems-glofas-reforecast'
          r = requests.get(schema_url, timeout=60)
          capture = {'status_code': r.status_code, 'url': schema_url, 'text_prefix': r.text[:30000]}
          try: capture['json'] = r.json()
          except Exception: pass
          Path('validation/model_v5_glofas_process_schema.json').write_text(json.dumps(capture, indent=2))

          client = cdsapi.Client(url=base, key=key)
          base_req = {
              'hydrological_model': ['lisflood'],
              'product_type': ['control_reforecast'],
              'variable': ['river_discharge_in_the_last_24_hours'],
              'hyear': ['2022'], 'hmonth': ['01'], 'hday': ['05'],
              'leadtime_hour': ['24'],
              'area': [13.0, 5.0, 4.0, 11.0],
              'data_format': 'grib2', 'download_format': 'zip',
          }
          variants = []
          for ver in ['operational','version_4_5','version_4_3','version_4_2','version_4_1','version_4_0']:
              for day in ['05','09','13','17','21','25','29','01']:
                  variants.append((f'{ver}_day{day}', {'system_version':[ver], 'hday':[day]}))
          # Old configuration control: known first v4 reforecast calendar date.
          variants.append(('v4_known_2022_03_27', {'system_version':['version_4_0'],'hmonth':['03'],'hday':['27']}))
          variants.append(('v4_known_2007_03_27', {'system_version':['version_4_0'],'hyear':['2007'],'hmonth':['03'],'hday':['27']}))

          results = {}
          for name, delta in variants:
              req = dict(base_req); req.update(delta)
              target = Path(f'/tmp/{name}.zip')
              try:
                  client.retrieve('cems-glofas-reforecast', req).download(str(target))
                  results[name] = {'ok':True,'bytes':target.stat().st_size,'request':req}
              except Exception as exc:
                  results[name] = {'ok':False,'error':str(exc)[:1800],'request':req}
              print(name, results[name]['ok'], results[name].get('bytes'), flush=True)
              if results[name]['ok']:
                  break

          first = next((k for k,v in results.items() if v.get('ok')), None)
          Path('validation/model_v5_glofas_contract_smoke.json').write_text(json.dumps({
              'dataset':'cems-glofas-reforecast','probe_hyear':2022,
              'fixed_day_schedule':[1,5,9,13,17,21,25,29],
              'results':results,'first_success':first
          }, indent=2))
          if not first:
              raise SystemExit('No fixed-day/current-version EWDS GloFAS contract succeeded')
          PY
      - name: Persist schema and probe result
        if: always()
        run: |
          test -f validation/model_v5_glofas_process_schema.json || exit 1
          test -f validation/model_v5_glofas_contract_smoke.json || exit 1
          git config user.name "naijaclimaguard-model-v5-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/model_v5_glofas_process_schema.json validation/model_v5_glofas_contract_smoke.json
          git diff --cached --quiet && exit 0
          git commit -m "model-v5: record fixed-day EWDS GloFAS contract probe"
          git pull --rebase origin model-v5-operational-native
          git push origin HEAD:model-v5-operational-native
