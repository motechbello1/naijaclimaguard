name: Model v5 GloFAS Contract Smoke

on:
  workflow_dispatch:
  push:
    branches: [model-v5-operational-native]
    paths:
      - "validation/model_v5_glofas_smoke_trigger.txt"
      - ".github/workflows/model-v5-glofas-contract-smoke.yml"

permissions:
  contents: write

env:
  EWDS_API_KEY: ${{ secrets.EWDS_API_KEY }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'cdsapi>=0.7.6,<0.8' requests
      - name: Inspect EWDS schema and isolate accepted GloFAS contract
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import cdsapi, requests

          base = 'https://ewds.climate.copernicus.eu/api'
          key = os.environ['EWDS_API_KEY']
          if not key:
              raise SystemExit('EWDS_API_KEY missing')

          schema_url = base + '/retrieve/v1/processes/cems-glofas-reforecast'
          r = requests.get(schema_url, timeout=60)
          schema_capture = {'status_code': r.status_code, 'url': schema_url, 'text_prefix': r.text[:30000]}
          try:
              schema_capture['json'] = r.json()
          except Exception:
              pass
          Path('validation/model_v5_glofas_process_schema.json').write_text(json.dumps(schema_capture, indent=2))

          client = cdsapi.Client(url=base, key=key)
          base_req = {
              'system_version': ['version_4_0'],
              'hydrological_model': ['lisflood'],
              'product_type': ['control_reforecast'],
              'variable': ['river_discharge_in_the_last_24_hours'],
              'hyear': ['2022'],
              'hmonth': ['01'],
              'hday': ['01'],
              'leadtime_hour': ['24'],
              'area': [13.0, 5.0, 4.0, 11.0],
              'data_format': 'grib2',
              'download_format': 'zip',
          }
          variants = {
              'documented_reference_2024_day01': {},
              'target_year_weekday_day03': {'hday': ['03']},
              'global_lisflood': {'hydrological_model': ['global_lisflood']},
              'no_area': {'__drop__': ['area']},
              'netcdf_unarchived': {'data_format': 'netcdf', 'download_format': 'unarchived'},
              'operational_system': {'system_version': ['operational']},
              'with_reference_year_2022': {'year': ['2022']},
          }
          results = {}
          for name, delta in variants.items():
              req = dict(base_req)
              for k in delta.get('__drop__', []):
                  req.pop(k, None)
              req.update({k: v for k, v in delta.items() if k != '__drop__'})
              suffix = '.nc' if req.get('data_format') == 'netcdf' else '.zip'
              target = Path(f'/tmp/glofas_contract_{name}{suffix}')
              try:
                  client.retrieve('cems-glofas-reforecast', req).download(str(target))
                  results[name] = {'ok': True, 'bytes': target.stat().st_size, 'request': req}
              except Exception as exc:
                  results[name] = {'ok': False, 'error': str(exc)[:2500], 'request': req}
              print(name, results[name]['ok'], results[name].get('bytes'), results[name].get('error', '')[:500], flush=True)
              if results[name]['ok']:
                  break

          Path('validation/model_v5_glofas_contract_smoke.json').write_text(json.dumps({
              'dataset': 'cems-glofas-reforecast',
              'probe_hyear': 2022,
              'lead_hours': [24],
              'results': results,
              'first_success': next((k for k,v in results.items() if v.get('ok')), None),
          }, indent=2))
          if not any(v.get('ok') for v in results.values()):
              raise SystemExit('No tested EWDS GloFAS contract succeeded')
          PY
      - name: Persist schema and probe result
        if: always()
        run: |
          test -f validation/model_v5_glofas_process_schema.json || exit 1
          test -f validation/model_v5_glofas_contract_smoke.json || exit 1
          git config user.name "naijaclimaguard-model-v5-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/model_v5_glofas_process_schema.json validation/model_v5_glofas_contract_smoke.json
          git diff --cached --quiet && exit 0
          git commit -m "model-v5: record EWDS GloFAS contract matrix"
          git pull --rebase origin model-v5-operational-native
          git push origin HEAD:model-v5-operational-native
