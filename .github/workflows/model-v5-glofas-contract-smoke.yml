name: Model v5 GloFAS Contract Smoke

on:
  push:
    branches: [model-v5-operational-native]
    paths:
      - "validation/model_v5_glofas_smoke_trigger.txt"
      - ".github/workflows/model-v5-glofas-contract-smoke.yml"

permissions:
  contents: write

env:
  EWDS_API_KEY: ${{ secrets.EWDS_API_KEY }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'cdsapi>=0.7.6,<0.8'
      - name: Probe official GloFAS v4.0 reforecast contract by hyear
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import cdsapi

          key = os.environ['EWDS_API_KEY']
          if not key:
              raise SystemExit('EWDS_API_KEY missing')
          client = cdsapi.Client(url='https://ewds.climate.copernicus.eu/api', key=key)
          results = {}
          for year in range(2018, 2025):
              target = Path(f'/tmp/glofas_probe_{year}.zip')
              request = {
                  'system_version': ['version_4_0'],
                  'hydrological_model': ['lisflood'],
                  'product_type': ['control_reforecast'],
                  'variable': ['river_discharge_in_the_last_24_hours'],
                  'hyear': [str(year)],
                  'hmonth': ['01'],
                  'hday': ['01'],
                  'leadtime_hour': ['24','48','72'],
                  'area': [13.0, 5.0, 4.0, 11.0],
                  'data_format': 'grib2',
                  'download_format': 'zip',
              }
              try:
                  client.retrieve('cems-glofas-reforecast', request).download(str(target))
                  results[str(year)] = {'ok': True, 'bytes': target.stat().st_size}
              except Exception as exc:
                  results[str(year)] = {'ok': False, 'error': str(exc)[:1200]}
              print(year, results[str(year)])
          Path('validation/model_v5_glofas_contract_smoke.json').write_text(json.dumps({
              'dataset': 'cems-glofas-reforecast',
              'system_version': 'version_4_0',
              'probe_reference_month_day': '01-01',
              'reference_year': 2024,
              'reference_date_weekday': 'Monday',
              'lead_hours': [24,48,72],
              'results': results,
          }, indent=2))
          if not any(v['ok'] for v in results.values()):
              raise SystemExit('All GloFAS v4.0 contract probes failed')
          PY
      - name: Persist probe result even when some years are unavailable
        if: always()
        run: |
          test -f validation/model_v5_glofas_contract_smoke.json || exit 1
          git config user.name "naijaclimaguard-model-v5-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/model_v5_glofas_contract_smoke.json
          git diff --cached --quiet && exit 0
          git commit -m "model-v5: record GloFAS source-contract probe"
          git pull --rebase origin model-v5-operational-native
          git push origin HEAD:model-v5-operational-native
