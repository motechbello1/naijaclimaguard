name: Model v6 Achievability Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [model-v5-operational-native]
    paths:
      - "validation/model_v6_achievability.py"
      - ".github/workflows/model-v6-achievability.yml"

permissions:
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  NASA_SOURCE_RUN_ID: "31292573245"

concurrency:
  group: model-v6-achievability
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: model-v5-operational-native
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: validation/model_v5_requirements.txt
      - name: Install pinned Model v5 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r validation/model_v5_requirements.txt
      - name: Verify frozen V5 evidence exists and remains blocked
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('validation/model_v5_results.json').read_text())
          f=json.loads(Path('validation/model_v5_freeze_manifest.json').read_text())
          assert r['status']=='model_v5_development_failed_freeze_gate'
          assert f['status']=='freeze_blocked'
          assert r['threshold_policy']['minimum_event_detection_rate']==0.75
          assert r['threshold_policy']['minimum_precision']==0.1
          assert r['threshold_policy']['maximum_false_positive_issue_rows_per_1000_negative']==10.0
          assert r['threshold_policy']['chosen_threshold'] is None
          print('Frozen V5 failure preserved; no gate changes permitted.')
          PY
      - name: Reuse preserved NASA source artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.NASA_SOURCE_RUN_ID }}
          pattern: model-v5-nasa-*
          path: validation/model_v5/work/nasa
          merge-multiple: true
      - name: Rebuild synchronized V5 dataset from preserved sources
        run: |
          python validation/build_model_v5_dataset.py \
            --nasa 'validation/model_v5/work/nasa/*.csv' \
            --glofas 'validation/model_v5/operational_archive_months/*.csv' \
            --events validation/model_v4_event_registry.csv \
            --start 2021-05-26 --end 2024-12-31 \
            --out validation/model_v5_issue_dataset.repro.csv \
            --manifest validation/model_v5_dataset_manifest.repro.json
      - name: Reproduce exact frozen V5 out-of-fold score
        run: |
          python validation/model_v5_operational_archive.py \
            --dataset validation/model_v5_issue_dataset.repro.csv \
            --events validation/model_v4_event_registry.csv \
            --output validation/model_v5_results.repro.json \
            --scored-output validation/model_v5_oof_scored.repro.csv
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('validation/model_v5_results.json').read_text())
          b=json.loads(Path('validation/model_v5_results.repro.json').read_text())
          for key in ['status','selected_candidate','threshold_policy','sanity','per_location']:
              assert a[key]==b[key], f'V5 reproduction mismatch: {key}'
          assert a['selected_candidate_metrics']['pooled_oof_metrics']==b['selected_candidate_metrics']['pooled_oof_metrics']
          print('Authoritative V5 scoring reproduced exactly.')
          PY
      - name: Compute location-conditioned threshold upper bound
        run: |
          python validation/model_v6_achievability.py \
            --scored validation/model_v5_oof_scored.repro.csv \
            --events validation/model_v4_event_registry.csv \
            --out validation/model_v6_achievability.json
      - name: Commit diagnostic result only
        run: |
          git config user.name "naijaclimaguard-model-v6-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/model_v6_achievability.json
          git diff --cached --quiet && exit 0
          git commit -m "model-v6: preserve V5 score-space achievability diagnostic ${GITHUB_RUN_ID}"
          git pull --rebase origin model-v5-operational-native
          git push origin HEAD:model-v5-operational-native
      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: model-v6-achievability-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            validation/model_v6_achievability.json
            validation/model_v5_results.repro.json
            validation/model_v5_oof_scored.repro.csv
            validation/model_v5_dataset_manifest.repro.json
