name: Fix My Tomorrow Public Shell

on:
  push:
    branches: [my-tomorrow-v2-prototype]
    paths:
      - ".github/workflows/fix-my-tomorrow-public-shell.yml"

permissions:
  contents: write

jobs:
  patch-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: my-tomorrow-v2-prototype
      - name: Remove obsolete unauthenticated popstate redirect
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/shared/AppShell.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''  useEffect(() => {
            const handlePopState = () => { if (!session) router.replace("/login"); };
            window.addEventListener("popstate", handlePopState);
            return () => window.removeEventListener("popstate", handlePopState);
          }, [session, router]);
          '''
          # Match the repository's two-space indentation exactly after normalizing
          # the heredoc indentation introduced by this workflow file.
          old = '\n'.join(line[8:] if line.startswith('        ') else line for line in old.splitlines()) + '\n'
          if old not in text:
              raise SystemExit('Expected AppShell popstate redirect block not found; refusing broad edit.')
          text = text.replace(old, '', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit patch
        run: |
          rm .github/workflows/fix-my-tomorrow-public-shell.yml
          git config user.name "NaijaClimaGuard CI"
          git config user.email "actions@users.noreply.github.com"
          git add components/shared/AppShell.tsx .github/workflows/fix-my-tomorrow-public-shell.yml
          git commit -m "fix: keep My Tomorrow public during browser navigation"
          git push origin HEAD:my-tomorrow-v2-prototype
