name: Security History Rewrite Preflight

on:
  push:
    branches: [security-history-rewrite-preflight]
    paths:
      - ".github/workflows/security-history-rewrite-preflight.yml"
      - "security/history-rewrite-preflight-trigger.txt"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install git-filter-repo
        run: python -m pip install --disable-pip-version-check git-filter-repo

      - name: Rewrite a disposable mirror and verify invariants
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/repo.git"
          cd "$RUNNER_TEMP/repo.git"

          git for-each-ref --format='%(refname)' refs/heads | sort > "$RUNNER_TEMP/heads.before"
          git for-each-ref --format='%(refname)' refs/tags | sort > "$RUNNER_TEMP/tags.before"

          MAIN_TREE_BEFORE=$(git rev-parse refs/heads/main^{tree})
          V4_ARTIFACT_BEFORE=$(git show refs/heads/main:validation/model_v4_frozen_artifact.json | sha256sum | awk '{print $1}')
          V4_MANIFEST_BEFORE=$(git show refs/heads/main:validation/MODEL_V4_FREEZE_MANIFEST.json | sha256sum | awk '{print $1}')
          EVENT_REGISTRY_BEFORE=$(git show refs/heads/main:validation/model_v4_event_registry.csv | sha256sum | awk '{print $1}')

          git filter-repo --path .env --invert-paths --force

          if git log --all --format='%H' -- .env | grep -q .; then
            echo "FAIL: .env still appears in rewritten commit history"
            exit 1
          fi

          if git rev-list --objects --all | awk '$2 == ".env" {print}' | grep -q .; then
            echo "FAIL: .env object remains reachable from rewritten refs"
            exit 1
          fi

          git for-each-ref --format='%(refname)' refs/heads | sort > "$RUNNER_TEMP/heads.after"
          git for-each-ref --format='%(refname)' refs/tags | sort > "$RUNNER_TEMP/tags.after"
          diff -u "$RUNNER_TEMP/heads.before" "$RUNNER_TEMP/heads.after"
          diff -u "$RUNNER_TEMP/tags.before" "$RUNNER_TEMP/tags.after"

          MAIN_TREE_AFTER=$(git rev-parse refs/heads/main^{tree})
          V4_ARTIFACT_AFTER=$(git show refs/heads/main:validation/model_v4_frozen_artifact.json | sha256sum | awk '{print $1}')
          V4_MANIFEST_AFTER=$(git show refs/heads/main:validation/MODEL_V4_FREEZE_MANIFEST.json | sha256sum | awk '{print $1}')
          EVENT_REGISTRY_AFTER=$(git show refs/heads/main:validation/model_v4_event_registry.csv | sha256sum | awk '{print $1}')

          test "$MAIN_TREE_BEFORE" = "$MAIN_TREE_AFTER"
          test "$V4_ARTIFACT_BEFORE" = "$V4_ARTIFACT_AFTER"
          test "$V4_MANIFEST_BEFORE" = "$V4_MANIFEST_AFTER"
          test "$EVENT_REGISTRY_BEFORE" = "$EVENT_REGISTRY_AFTER"

          cat > "$GITHUB_WORKSPACE/security/history-rewrite-preflight-result.txt" <<EOF
          PASS
          Disposable mirror rewrite removed the tracked root .env path from all rewritten refs.
          Branch names preserved: yes
          Tag names preserved: yes
          Current main tree unchanged: yes
          Frozen Model v4 artifact bytes unchanged: yes
          Model v4 freeze manifest bytes unchanged: yes
          Frozen event-registry bytes unchanged: yes
          Note: affected commit SHAs necessarily change during a real rewrite.
          EOF

          cat "$GITHUB_WORKSPACE/security/history-rewrite-preflight-result.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Persist verifiable preflight result
        run: |
          set -euo pipefail
          git config user.name "naijaclimaguard-security-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security/history-rewrite-preflight-result.txt
          git diff --cached --quiet && exit 0
          git commit -m "security: record history rewrite preflight result"
          git pull --rebase origin security-history-rewrite-preflight
          git push origin HEAD:security-history-rewrite-preflight
