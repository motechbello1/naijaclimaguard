name: Economic Exposure Factory

on:
  push:
    branches: [investor-national-scale-readiness]
    paths:
      - "validation/economic_exposure_factory/**"
      - ".github/workflows/economic-exposure-factory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national-economic-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests pandas
      - name: Compile
        run: python -m py_compile validation/economic_exposure_factory/build_national_exposure_baseline.py
      - name: Build baseline
        run: python validation/economic_exposure_factory/build_national_exposure_baseline.py
      - name: Preserve economic evidence
        uses: actions/upload-artifact@v4
        with:
          name: economic-exposure-baseline-${{ github.sha }}
          path: validation/economic_exposure_factory/out/
          retention-days: 90
