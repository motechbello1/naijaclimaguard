name: Model V7-E False Alert Audit

on:
  push:
    branches: [competition-model-v7-no-approval]
    paths:
      - "validation/model_v7_e_false_alert_audit.py"
      - ".github/workflows/model-v7-e-false-alert-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "validation/model_v7_e_false_alert_audit.py"
      - ".github/workflows/model-v7-e-false-alert-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-v7-e-false-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  false-alert-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install modelling dependencies
        run: python -m pip install --disable-pip-version-check --quiet numpy scikit-learn xgboost
      - name: Build strongest unmatched alert list
        run: python validation/model_v7_e_false_alert_audit.py
      - name: Verify holdout remains untouched
        run: |
          python - <<'PY'
          import json
          p='validation/model_v7_e_false_alert_audit.json'
          r=json.load(open(p, encoding='utf-8'))
          assert r['holdout_2026_queried'] is False
          assert r['event_count'] == 19
          print('False-alert audit stayed inside 2024-2025 development data.')
          PY
      - name: Upload label-audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: model-v7-e-false-alert-audit-${{ github.run_id }}
          path: validation/model_v7_e_false_alert_audit.json
          retention-days: 90
          if-no-files-found: error
