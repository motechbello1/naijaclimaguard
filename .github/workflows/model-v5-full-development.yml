name: Model v5 Full Operational-Archive Development

on:
  workflow_dispatch:
  push:
    branches: [model-v5-operational-native]
    paths:
      - "validation/model_v5_full_run_trigger.txt"

permissions:
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  NASA_SOURCE_RUN_ID: "31292573245"

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify preregistered consistent control-forecast protocol
        run: |
          test -f validation/MODEL_V5_OPERATIONAL_ARCHIVE_PROTOCOL.md
          test -f validation/model_v4_event_registry.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          text = Path('validation/MODEL_V5_OPERATIONAL_ARCHIVE_PROTOCOL.md').read_text()
          assert '2021-05-26' in text
          assert '2022, 2023 and 2024' in text
          with open('validation/model_v4_event_registry.csv', newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          enabled = [r for r in rows if str(r.get('include_in_benchmark', '')).lower() == 'true']
          assert len({r.get('event_id') for r in enabled if r.get('event_id')}) == 35
          print('Frozen 35-event registry and 2021-05-26 control-forecast start verified before scoring')
          PY

  glofas:
    needs: protocol
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: model-v5-ewds-source-access
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { year: 2021, quarter: 2, months: "5 6" }
          - { year: 2021, quarter: 3, months: "7 8 9" }
          - { year: 2021, quarter: 4, months: "10 11 12" }
          - { year: 2022, quarter: 1, months: "1 2 3" }
          - { year: 2022, quarter: 2, months: "4 5 6" }
          - { year: 2022, quarter: 3, months: "7 8 9" }
          - { year: 2022, quarter: 4, months: "10 11 12" }
          - { year: 2023, quarter: 1, months: "1 2 3" }
          - { year: 2023, quarter: 2, months: "4 5 6" }
          - { year: 2023, quarter: 3, months: "7 8 9" }
          - { year: 2023, quarter: 4, months: "10 11 12" }
          - { year: 2024, quarter: 1, months: "1 2 3" }
          - { year: 2024, quarter: 2, months: "4 5 6" }
          - { year: 2024, quarter: 3, months: "7 8 9" }
          - { year: 2024, quarter: 4, months: "10 11 12" }
    env:
      EWDS_API_KEY: ${{ secrets.EWDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: validation/model_v5_requirements.txt
      - name: Install Model v5 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r validation/model_v5_requirements.txt
      - name: Verify EWDS credential
        run: test -n "$EWDS_API_KEY" || (echo 'EWDS_API_KEY missing' && exit 1)
      - name: Restore successful GloFAS archives from earlier attempts
        uses: actions/cache/restore@v4
        with:
          path: validation/model_v5/work/glofas_raw_${{ matrix.year }}_q${{ matrix.quarter }}
          key: model-v5-glofas-raw-${{ matrix.year }}-q${{ matrix.quarter }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            model-v5-glofas-raw-${{ matrix.year }}-q${{ matrix.quarter }}-
      - name: Fetch archived operational GloFAS control forecasts
        run: |
          python validation/fetch_glofas_operational_archive_v5.py \
            --year "${{ matrix.year }}" \
            --months ${{ matrix.months }} \
            --lead-hours 24 48 72 \
            --workers 1 \
            --raw-dir "validation/model_v5/work/glofas_raw_${{ matrix.year }}_q${{ matrix.quarter }}" \
            --out "validation/model_v5/work/glofas_${{ matrix.year }}_q${{ matrix.quarter }}.csv"
      - name: Persist every successful daily archive for resume
        if: always()
        uses: actions/cache/save@v4
        with:
          path: validation/model_v5/work/glofas_raw_${{ matrix.year }}_q${{ matrix.quarter }}
          key: model-v5-glofas-raw-${{ matrix.year }}-q${{ matrix.quarter }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload GloFAS source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-v5-glofas-${{ matrix.year }}-q${{ matrix.quarter }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            validation/model_v5/work/glofas_${{ matrix.year }}_q${{ matrix.quarter }}.csv
            validation/model_v5/work/glofas_${{ matrix.year }}_q${{ matrix.quarter }}.source_manifest.json

  develop:
    needs: [glofas]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: validation/model_v5_requirements.txt
      - name: Install pinned Model v5 environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r validation/model_v5_requirements.txt
          python -m pip freeze > validation/model_v5_environment_freeze.txt
      - name: Reuse successful NASA artifacts from preserved source run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.NASA_SOURCE_RUN_ID }}
          pattern: model-v5-nasa-*
          path: validation/model_v5/work/nasa
          merge-multiple: true
      - name: Download GloFAS artifacts from this run
        uses: actions/download-artifact@v4
        with:
          pattern: model-v5-glofas-*
          path: validation/model_v5/work/glofas
          merge-multiple: true
      - name: Verify source packs before scoring
        run: |
          python - <<'PY'
          from pathlib import Path
          nasa = sorted(Path('validation/model_v5/work/nasa').glob('nasa_*.csv'))
          nasa_years = sorted({p.stem.split('_')[-1] for p in nasa})
          required_nasa = [str(y) for y in range(2021, 2025)]
          missing_nasa = sorted(set(required_nasa) - set(nasa_years))
          glofas = sorted(Path('validation/model_v5/work/glofas').glob('glofas_*_q*.csv'))
          manifests = sorted(Path('validation/model_v5/work/glofas').glob('glofas_*_q*.source_manifest.json'))
          print('NASA years:', nasa_years)
          print('GloFAS quarter files:', len(glofas))
          print('GloFAS source manifests:', len(manifests))
          if missing_nasa:
              raise SystemExit(f'Missing reused NASA years: {missing_nasa}')
          if len(glofas) != 15:
              raise SystemExit(f'Expected 15 GloFAS quarter files, found {len(glofas)}')
          PY
      - name: Compile and run Model v5 contract tests
        run: |
          python -m py_compile \
            validation/fetch_glofas_operational_archive_v5.py \
            validation/build_model_v5_dataset.py \
            validation/model_v5_operational_native.py \
            validation/model_v5_operational_archive.py \
            validation/freeze_model_v5_candidate.py
          python -m unittest discover -s validation/tests -p 'test_model_v5.py' -v
      - name: Build strict issue-time operational dataset
        run: |
          python validation/build_model_v5_dataset.py \
            --nasa 'validation/model_v5/work/nasa/*.csv' \
            --glofas 'validation/model_v5/work/glofas/*.csv' \
            --events validation/model_v4_event_registry.csv \
            --start 2021-05-26 \
            --end 2024-12-31 \
            --out validation/model_v5_issue_dataset.csv \
            --manifest validation/model_v5_dataset_manifest.json
      - name: Run preregistered temporal candidates and ablations
        run: |
          python validation/model_v5_operational_archive.py \
            --dataset validation/model_v5_issue_dataset.csv \
            --events validation/model_v4_event_registry.csv \
            --output validation/model_v5_results.json \
            --scored-output validation/model_v5_oof_scored.csv
      - name: Apply gated freeze serializer
        run: |
          python validation/freeze_model_v5_candidate.py \
            --dataset validation/model_v5_issue_dataset.csv \
            --dataset-manifest validation/model_v5_dataset_manifest.json \
            --events validation/model_v4_event_registry.csv \
            --results validation/model_v5_results.json \
            --protocol validation/MODEL_V5_OPERATIONAL_ARCHIVE_PROTOCOL.md \
            --model-out validation/model_v5_freeze_candidate.joblib \
            --manifest-out validation/model_v5_freeze_manifest.json
      - name: Summarize scientific decision
        run: |
          python - <<'PY'
          import json
          r = json.load(open('validation/model_v5_results.json'))
          f = json.load(open('validation/model_v5_freeze_manifest.json'))
          m = r['selected_candidate_metrics']['pooled_oof_metrics']
          print('STATUS:', r['status'])
          print('WINNER:', r['selected_candidate'])
          print('POOLED PR-AUC:', m['pr_auc'])
          print('POOLED ROC-AUC:', m['roc_auc'])
          print('POOLED BRIER:', m['brier_score'])
          print('SANITY:', r['sanity'])
          print('THRESHOLD:', r['threshold_policy']['chosen_threshold'])
          print('FREEZE:', f['status'])
          if f['status'] == 'freeze_blocked': print('BLOCKERS:', f['blockers'])
          PY
      - name: Preserve machine-readable decision on development branch
        if: github.ref_name == 'model-v5-operational-native'
        run: |
          git config user.name "naijaclimaguard-model-v5-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            validation/model_v5_dataset_manifest.json \
            validation/model_v5_results.json \
            validation/model_v5_freeze_manifest.json \
            validation/model_v5_environment_freeze.txt
          git diff --cached --quiet && exit 0
          git commit -m "model-v5: preserve operational-archive development decision ${GITHUB_RUN_ID}"
          git pull --rebase origin model-v5-operational-native
          git push origin HEAD:model-v5-operational-native
      - uses: actions/upload-artifact@v4
        with:
          name: model-v5-development-evidence-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            validation/model_v5_issue_dataset.csv
            validation/model_v5_dataset_manifest.json
            validation/model_v5_results.json
            validation/model_v5_oof_scored.csv
            validation/model_v5_freeze_manifest.json
            validation/model_v5_freeze_candidate.joblib
            validation/model_v5_environment_freeze.txt
