name: Explanation UX Type Check

on:
  pull_request:
    paths:
      - "components/shared/ExplanationMode.tsx"
      - "components/shared/AppShell.tsx"
      - ".github/workflows/ux-explanation-check.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: TypeScript check
        run: npx tsc --noEmit
