name: Riverine Watch v1 Prospective Shadow

on:
  workflow_dispatch:
  schedule:
    # 12:17 UTC = 13:17 Africa/Lagos. Later than the existing 06:17 UTC
    # Model v4 job to reduce same-day GloFAS publication-latency failures.
    - cron: "17 12 * * *"

permissions:
  contents: write

concurrency:
  group: riverine-watch-v1-prospective-shadow
  cancel-in-progress: false

jobs:
  issue-shadow-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      EWDS_API_KEY: ${{ secrets.EWDS_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout frozen evidence branch
        uses: actions/checkout@v4
        with:
          ref: riverine-watch-v1-evidence
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: validation/model_v4_live_requirements.txt

      - name: Install live source runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r validation/model_v4_live_requirements.txt

      - name: Verify source credentials and frozen model
        run: |
          test -n "$EARTHDATA_TOKEN" || (echo "EARTHDATA_TOKEN missing" && exit 1)
          test -n "$EWDS_API_KEY" || (echo "EWDS_API_KEY missing" && exit 1)
          test "$(git hash-object validation/riverine_watch_v1_model.json)" = "fe21155b33acdbe491b2bc0d130ccf2d889ff5fb" \
            || (echo "Riverine Watch v1 model blob hash mismatch" && exit 1)
          test "$(git hash-object validation/riverine_watch_v1.py)" = "a7e6709095d1efcf1cf8ada621e6b5c578767e7f" \
            || (echo "Riverine Watch v1 inference code blob hash mismatch" && exit 1)

      - name: Verify frozen replay regression
        run: python -m unittest validation.tests.test_riverine_watch_v1 -v

      - name: Issue or record source-delay status
        run: |
          python validation/riverine_watch_v1_prospective.py \
            --operational-date "$(date -u +%F)" \
            --root validation/prospective/riverine_watch_v1 \
            --ledger validation/prospective/riverine_watch_v1_ledger.jsonl

      - name: Preserve diagnostic source work pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riverine-watch-v1-source-pack-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            validation/prospective/riverine_watch_v1/work/
            validation/prospective/riverine_watch_v1/status/

      - name: Commit append-only shadow evidence
        run: |
          git config user.name "naijaclimaguard-riverine-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/prospective/riverine_watch_v1 validation/prospective/riverine_watch_v1_ledger.jsonl
          if git diff --cached --quiet; then
            echo "No new evidence record"
            exit 0
          fi
          git commit -m "prospective: riverine watch v1 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin riverine-watch-v1-evidence
          git push origin HEAD:riverine-watch-v1-evidence
