name: Product Typecheck

on:
  push:
    branches: [main, product-2026-action-engine, product-2026-source-fusion]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "prisma/**"
      - "middleware.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/product-2026-typecheck.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "prisma/**"
      - "middleware.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/product-2026-typecheck.yml"

permissions:
  contents: read

concurrency:
  group: product-typecheck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
