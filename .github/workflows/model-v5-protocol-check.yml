name: Model v5 Operational-Native Protocol Check

on:
  pull_request:
    paths:
      - "validation/MODEL_V5_PROTOCOL.md"
      - "validation/fetch_nasa_imerg_early_history_v5.py"
      - "validation/fetch_glofas_reforecast_v5.py"
      - "validation/build_model_v5_dataset.py"
      - "validation/model_v5_operational_native.py"
      - "validation/model_v5_requirements.txt"
      - "validation/tests/test_model_v5.py"
      - ".github/workflows/model-v5-*.yml"
  push:
    branches: [model-v5-operational-native]
    paths:
      - "validation/MODEL_V5_PROTOCOL.md"
      - "validation/fetch_nasa_imerg_early_history_v5.py"
      - "validation/fetch_glofas_reforecast_v5.py"
      - "validation/build_model_v5_dataset.py"
      - "validation/model_v5_operational_native.py"
      - "validation/model_v5_requirements.txt"
      - "validation/tests/test_model_v5.py"
      - ".github/workflows/model-v5-*.yml"

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: validation/model_v5_requirements.txt
      - name: Install pinned Model v5 environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r validation/model_v5_requirements.txt
      - name: Compile Model v5 source
        run: |
          python -m py_compile \
            validation/fetch_nasa_imerg_early_history_v5.py \
            validation/fetch_glofas_reforecast_v5.py \
            validation/build_model_v5_dataset.py \
            validation/model_v5_operational_native.py
      - name: Run leakage and source-contract tests
        run: python -m unittest discover -s validation/tests -p 'test_model_v5.py' -v
      - name: Verify frozen protocol and event-registry invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          protocol = Path('validation/MODEL_V5_PROTOCOL.md').read_text(encoding='utf-8')
          required = [
              'strictly in the next 1–3 days',
              'GPM_3IMERGDE',
              'cems-glofas-reforecast',
              '+24h, +48h, +72h',
              'precision >= 10%',
              'false-positive issue rows <= 10 per 1,000',
              'Production remains `derived-v2`',
          ]
          missing = [x for x in required if x not in protocol]
          if missing:
              raise SystemExit(f'Protocol invariant missing: {missing}')
          events = pd.read_csv('validation/model_v4_event_registry.csv')
          enabled = events[events['include_in_benchmark'].astype(str).str.lower().eq('true')]
          if enabled['event_id'].nunique() != 35:
              raise SystemExit('Model v5 requires exactly 35 frozen event anchors')
          if set(enabled['location']) != {'Lokoja','Makurdi','Onitsha','Yenagoa','Hadejia'}:
              raise SystemExit('Frozen location set changed')
          print('Model v5 protocol invariants verified')
          PY
