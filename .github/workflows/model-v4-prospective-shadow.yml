name: Model v4 Prospective Shadow Forecast

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - validation/prospective/model_v4_manual_trigger.txt
  schedule:
    # 06:17 UTC = 07:17 Africa/Lagos. This gives the previous UTC day time
    # to close and NASA IMERG Early time to reach its near-real-time archive.
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: model-v4-prospective-shadow
  cancel-in-progress: false

jobs:
  issue-shadow-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      EWDS_API_KEY: ${{ secrets.EWDS_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout exact issue-time code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: validation/model_v4_live_requirements.txt

      - name: Install prospective runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r validation/model_v4_live_requirements.txt
          python -m pip freeze > validation/prospective-runtime-freeze.txt

      - name: Verify required source credentials
        run: |
          test -n "$EARTHDATA_TOKEN" || (echo "EARTHDATA_TOKEN missing" && exit 1)
          test -n "$EWDS_API_KEY" || (echo "EWDS_API_KEY missing" && exit 1)

      - name: Verify frozen artifact before issue
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest_path = Path("validation/MODEL_V4_FREEZE_MANIFEST.json")
          if not manifest_path.exists():
              raise SystemExit("Freeze manifest missing; prospective evidence cannot start")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          artifact = Path(manifest["artifact_path"])
          actual = hashlib.sha256(artifact.read_bytes()).hexdigest()
          expected = manifest["artifact_sha256"]
          if actual != expected:
              raise SystemExit(f"Frozen artifact hash mismatch: {actual} != {expected}")
          if manifest.get("replacement_authorized") is not False:
              raise SystemExit("Freeze manifest must keep production replacement disabled")
          print(f"verified frozen artifact {actual}")
          PY

      - name: Fix one issue timestamp for every source and location
        run: echo "ISSUE_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Fetch NASA IMERG Early V07 recent rainfall
        run: |
          python validation/fetch_nasa_imerg_early_current.py \
            --days 35 \
            --out validation/prospective/work/nasa_imerg_early_daily.csv

      - name: Fetch current GloFAS operational forecast
        run: |
          TODAY=$(date -u +%F)
          YESTERDAY=$(date -u -d 'yesterday' +%F)
          python validation/fetch_glofas_current.py \
            --issue-date "$TODAY" \
            --out validation/prospective/work/glofas_current.csv \
          || python validation/fetch_glofas_current.py \
            --issue-date "$YESTERDAY" \
            --out validation/prospective/work/glofas_current.csv

      - name: Build issue-time full-source feature vector
        run: |
          python validation/model_v4_build_live_features.py \
            --nasa validation/prospective/work/nasa_imerg_early_daily.csv \
            --glofas validation/prospective/work/glofas_current.csv \
            --issue-time-utc "$ISSUE_TIME" \
            --output validation/prospective/work/model_v4_issue_input.json

      - name: Score exact frozen Model v4 artifact
        run: |
          python validation/model_v4_predict.py \
            --artifact validation/model_v4_frozen_artifact.json \
            --input validation/prospective/work/model_v4_issue_input.json \
            --output validation/prospective/work/model_v4_scored.json

      - name: Create append-only prospective issue
        id: ledger
        run: |
          LEDGER_PATH=$(python validation/model_v4_append_ledger.py \
            --scored validation/prospective/work/model_v4_scored.json \
            --root validation/prospective/predictions | tail -n 1)
          echo "path=$LEDGER_PATH" >> "$GITHUB_OUTPUT"
          echo "Prospective issue: $LEDGER_PATH"

      - name: Preserve diagnostic source pack
        uses: actions/upload-artifact@v4
        with:
          name: model-v4-shadow-source-pack-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: |
            validation/prospective/work/nasa_imerg_early_daily.csv
            validation/prospective/work/glofas_current.csv
            validation/prospective/work/model_v4_issue_input.json
            validation/prospective/work/model_v4_scored.json
            validation/prospective-runtime-freeze.txt

      - name: Commit immutable issue to default branch
        if: github.ref_name == 'main'
        run: |
          git config user.name "naijaclimaguard-prospective-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.ledger.outputs.path }}"
          git diff --cached --quiet && (echo "No new ledger record" && exit 1)
          git commit -m "prospective: issue Model v4 shadow forecast ${ISSUE_TIME}"
          git pull --rebase origin main
          git push origin HEAD:main
