name: Model v5 Batched First Month

on:
  pull_request:
    paths:
      - "validation/model_v5_first_month_trigger.txt"
      - ".github/workflows/model-v5-batched-first-month.yml"
      - "validation/fetch_glofas_operational_archive_v5_batched.py"

permissions:
  contents: write

env:
  EWDS_API_KEY: ${{ secrets.EWDS_API_KEY }}
  PYTHONUNBUFFERED: "1"

concurrency:
  group: model-v5-ewds-source-access
  cancel-in-progress: true

jobs:
  may-2021:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: model-v5-operational-native
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: validation/model_v5_requirements.txt
      - name: Install Model v5 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r validation/model_v5_requirements.txt
      - name: Restore May 2021 validated raw progress
        uses: actions/cache/restore@v4
        with:
          path: validation/model_v5/work/month_2021_5
          key: model-v5-glofas-month-2021-5-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            model-v5-glofas-month-2021-5-
      - name: Preserve May 2021 from existing validated archives only
        run: |
          mkdir -p validation/model_v5/operational_archive_months
          python validation/fetch_glofas_operational_archive_v5_batched.py \
            --year 2021 --months 5 --lead-hours 24 48 72 \
            --raw-dir validation/model_v5/work/month_2021_5 \
            --out validation/model_v5/operational_archive_months/glofas_2021_m05.csv \
            --existing-only --allow-partial-pack
      - name: Save restored raw progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: validation/model_v5/work/month_2021_5
          key: model-v5-glofas-month-2021-5-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify source contract and transparent partial status
        run: |
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          csvp=Path('validation/model_v5/operational_archive_months/glofas_2021_m05.csv')
          manp=Path('validation/model_v5/operational_archive_months/glofas_2021_m05.source_manifest.json')
          m=json.loads(manp.read_text()); df=pd.read_csv(csvp); c=m['source_contract']
          assert c == {'archive_start':'2021-05-26','dataset':'cems-glofas-forecast','hydrological_model':'lisflood','lead_hours':[24,48,72],'product_type':'control_forecast','system_version':'operational'}
          assert m['request_strategy']=='monthly_batch_with_verified_daily_fallback_and_resume'
          assert m['pack_status']=='partial_pack_pending_final_synchronized_coverage_qa'
          assert m['partial_pack_allowed'] is True
          assert m['final_scientific_coverage_gate_scope']=='build_model_v5_dataset synchronized issue-time dataset core features'
          assert m['missing_issue_dates']==['2021-05-30']
          assert int(m['requested_issue_dates'])==6
          assert int(m['extracted_issue_dates'])==5
          assert int(m['output_rows'])==75
          assert abs(float(m['coverage']) - (5/6)) < 1e-9
          assert set(df['lead_time_hours'].unique()) == {24,48,72}
          assert df['location'].nunique() == 5
          assert len(df) == 75
          print('May 2021 transparent partial pack verified: 75 rows; missing only 2021-05-30; final synchronized >=90% gate unchanged')
          PY
      - name: Commit first durable month pack
        run: |
          git config user.name "naijaclimaguard-model-v5-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/model_v5/operational_archive_months/glofas_2021_m05.csv validation/model_v5/operational_archive_months/glofas_2021_m05.source_manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "model-v5: preserve transparent GloFAS 2021-05 partial pack"
          git pull --rebase origin model-v5-operational-native
          git push origin HEAD:model-v5-operational-native
      - uses: actions/upload-artifact@v4
        with:
          name: model-v5-glofas-2021-05-durable
          retention-days: 90
          path: |
            validation/model_v5/operational_archive_months/glofas_2021_m05.csv
            validation/model_v5/operational_archive_months/glofas_2021_m05.source_manifest.json
