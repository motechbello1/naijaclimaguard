name: NASA IMERG Permission PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - "validation/fetch_nasa_imerg.py"
      - "validation/nasa_permission_trigger.txt"

permissions:
  contents: read

env:
  EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}

jobs:
  nasa-permission:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'validation-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: pip install "earthaccess>=0.15,<1" "fsspec>=2024.6,<2027" "h5py>=3.11,<4" "pandas<3" "numpy<3" "aiohttp>=3.9,<4" "requests>=2.32,<3"
      - name: Verify Earthdata secret
        run: test -n "$EARTHDATA_TOKEN" || { echo "EARTHDATA_TOKEN missing"; exit 1; }
      - name: Diagnose direct GESDISC bearer access
        run: |
          python - <<'PY'
          import os, requests
          url='https://data.gesdisc.earthdata.nasa.gov/data/GPM_L3/GPM_3IMERGDF.07/2018/01/3B-DAY.MS.MRG.3IMERG.20180101-S000000-E235959.V07B.nc4'
          headers={
              'Authorization': f"Bearer {os.environ['EARTHDATA_TOKEN']}",
              'Range': 'bytes=0-1023',
              'User-Agent': 'NaijaClimaGuard-Validation-v2/1.0',
          }
          r=requests.get(url, headers=headers, allow_redirects=False, timeout=60)
          print('status=', r.status_code)
          print('location=', r.headers.get('Location'))
          print('content_type=', r.headers.get('Content-Type'))
          print('content_range=', r.headers.get('Content-Range'))
          if r.status_code not in (200, 206):
              raise SystemExit(f'Direct bearer byte-range request failed with HTTP {r.status_code}')
          print('Direct bearer access succeeded.')
          PY
      - name: Read one day of NASA IMERG Final V07
        run: |
          python validation/fetch_nasa_imerg.py \
            --start 2018-01-01 \
            --end 2018-01-01 \
            --out validation/nasa_permission_test.csv \
            --batch-size 1
      - name: Verify five Nigerian site values
        run: |
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv('validation/nasa_permission_test.csv')
          print(d.to_string(index=False))
          assert len(d) == 5, len(d)
          assert set(d.location) == {'Lokoja','Makurdi','Onitsha','Yenagoa','Hadejia'}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nasa-imerg-permission-${{ github.run_number }}
          retention-days: 7
          path: validation/nasa_permission_test.csv
