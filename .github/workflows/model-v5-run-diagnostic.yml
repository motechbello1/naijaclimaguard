name: Model v5 Heavy Run Diagnostic

on:
  push:
    branches: [model-v5-operational-native]
    paths:
      - ".github/workflows/model-v5-run-diagnostic.yml"
      - "validation/model_v5_diagnostic_trigger.txt"

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect latest heavy v5 workflow and persist exact job state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
            'Authorization': f'Bearer {token}',
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'naijaclimaguard-v5-diagnostic',
          }
          def get(url):
            req = urllib.request.Request(url, headers=headers)
            with urllib.request.urlopen(req, timeout=60) as r:
              return json.loads(r.read())

          runs = get(f'https://api.github.com/repos/{repo}/actions/workflows/model-v5-full-development.yml/runs?branch=model-v5-operational-native&per_page=20')['workflow_runs']
          if not runs:
            raise SystemExit('No Model v5 full-development run found')
          run = runs[0]
          jobs = get(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/jobs?per_page=100')['jobs']
          out = {
            'workflow_run': {
              'id': run['id'], 'run_number': run['run_number'], 'event': run['event'],
              'status': run['status'], 'conclusion': run['conclusion'],
              'head_sha': run['head_sha'], 'created_at': run['created_at'],
              'updated_at': run['updated_at'], 'html_url': run['html_url']
            },
            'jobs': []
          }
          for j in jobs:
            item = {
              'id': j['id'], 'name': j['name'], 'status': j['status'],
              'conclusion': j['conclusion'], 'started_at': j['started_at'],
              'completed_at': j['completed_at'],
              'failed_steps': [s['name'] for s in j.get('steps', []) if s.get('conclusion') == 'failure'],
              'steps': [{'name': s['name'], 'status': s['status'], 'conclusion': s['conclusion']} for s in j.get('steps', [])]
            }
            out['jobs'].append(item)
          os.makedirs('validation', exist_ok=True)
          with open('validation/model_v5_heavy_run_diagnostic.json','w') as f:
            json.dump(out, f, indent=2)
          print(json.dumps(out, indent=2))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "naijaclimaguard-model-v5-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/model_v5_heavy_run_diagnostic.json
          git diff --cached --quiet && exit 0
          git commit -m "model-v5: persist heavy-run diagnostic"
          git pull --rebase origin model-v5-operational-native
          git push origin HEAD:model-v5-operational-native
