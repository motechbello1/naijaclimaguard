name: Model v5 Batched Acquisition Code Check

on:
  pull_request:
    paths:
      - "validation/fetch_glofas_operational_archive_v5.py"
      - "validation/fetch_glofas_operational_archive_v5_batched.py"
      - ".github/workflows/model-v5-monthly-durable-closure.yml"
      - ".github/workflows/model-v5-batched-codecheck.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile acquisition code
        run: python -m py_compile validation/fetch_glofas_operational_archive_v5.py validation/fetch_glofas_operational_archive_v5_batched.py
      - name: Verify frozen contract remains in batching path
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path('validation/fetch_glofas_operational_archive_v5.py').read_text()
          batch=Path('validation/fetch_glofas_operational_archive_v5_batched.py').read_text()
          protocol=Path('validation/MODEL_V5_OPERATIONAL_ARCHIVE_PROTOCOL.md').read_text()
          for token in ('2021-05-26','cems-glofas-forecast','operational','lisflood','control_forecast'):
              assert token in base or token.replace('_',' ') in base
          assert 'monthly_batch_with_verified_daily_fallback' in batch
          assert '[24, 48, 72]' in batch
          assert 'MIN_COVERAGE' in batch
          assert '2021-05-26' in protocol
          assert '2022, 2023 and 2024' in protocol
          print('Batched transport compiles and preserves the frozen Model v5 source contract.')
          PY
