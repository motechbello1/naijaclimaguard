name: Fix My Tomorrow Public Shell PR

on:
  pull_request:
    branches: [data-engine-no-approval-v1]
    paths:
      - ".github/workflows/fix-my-tomorrow-public-shell-pr.yml"

permissions:
  contents: write

jobs:
  patch-public-shell:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'my-tomorrow-v2-prototype'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: my-tomorrow-v2-prototype
          persist-credentials: true
      - name: Remove obsolete unauthenticated browser-back redirect
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('components/shared/AppShell.tsx')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'\n\s*useEffect\(\(\) => \{\s*'
              r'const handlePopState = \(\) => \{ if \(!session\) router\.replace\("/login"\); \};\s*'
              r'window\.addEventListener\("popstate", handlePopState\);\s*'
              r'return \(\) => window\.removeEventListener\("popstate", handlePopState\);\s*'
              r'\}, \[session, router\]\);\s*',
              re.MULTILINE,
          )
          updated, count = pattern.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one stale popstate listener, matched {count}; refusing broad edit.')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit fix
        run: |
          rm .github/workflows/fix-my-tomorrow-public-shell-pr.yml
          git config user.name "NaijaClimaGuard CI"
          git config user.email "actions@users.noreply.github.com"
          git add components/shared/AppShell.tsx .github/workflows/fix-my-tomorrow-public-shell-pr.yml
          git commit -m "fix: keep public My Tomorrow navigation public"
          git push origin HEAD:my-tomorrow-v2-prototype
