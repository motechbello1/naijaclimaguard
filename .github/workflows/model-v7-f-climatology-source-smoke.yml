name: Model V7-F Climatology Source Smoke

on:
  push:
    branches: [competition-model-v7-no-approval]
    paths:
      - "validation/model_v7_f_climatology_source_smoke.py"
      - ".github/workflows/model-v7-f-climatology-source-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "validation/model_v7_f_climatology_source_smoke.py"
      - ".github/workflows/model-v7-f-climatology-source-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-v7-f-climatology-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  climatology-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify leakage-safe historical climatology source
        run: python validation/model_v7_f_climatology_source_smoke.py
