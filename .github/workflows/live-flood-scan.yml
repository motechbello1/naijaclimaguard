name: Live flood intelligence scan

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-flood-scan.yml"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger production flood intelligence ingestion
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 90 \
            "https://naijaclimaguard.vercel.app/api/cron/flood-intelligence"
