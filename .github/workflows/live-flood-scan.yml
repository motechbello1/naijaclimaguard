name: Live flood intelligence scan

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-flood-scan.yml"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check the cron secret is configured
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Add CRON_SECRET to the repository secrets (and the same value to Vercel) before this job can run."
            exit 1
          fi

      - name: Trigger production flood intelligence ingestion
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://naijaclimaguard.vercel.app/api/cron/flood-intelligence"

      - name: Run the background alert checker
        # The alert checker already refuses to run without CRON_SECRET, and no
        # Vercel cron was ever configured, so saved alerts were never evaluated.
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://naijaclimaguard.vercel.app/api/cron/alerts"

      - name: FloodPass housekeeping (warning drafts and sending, photo expiry, plan expiry)
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://naijaclimaguard.vercel.app/api/cron/floodpass"
