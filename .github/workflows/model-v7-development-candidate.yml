name: Model V7 Development Candidate

on:
  push:
    branches: [competition-model-v7-no-approval]
    paths:
      - "validation/model_v7_development_candidate.py"
      - "validation/model_v7_event_registry_candidates.csv"
      - "validation/model_v7_event_location_adjudication.csv"
      - "validation/model_event_time_adjudication_2022_2024.csv"
      - "validation/model_v4_event_registry.csv"
      - "validation/model_v7_rainfall_baseline_result.json"
      - ".github/workflows/model-v7-development-candidate.yml"
  pull_request:
    branches: [main]
    paths:
      - "validation/model_v7_development_candidate.py"
      - "validation/model_v7_event_registry_candidates.csv"
      - "validation/model_v7_event_location_adjudication.csv"
      - "validation/model_event_time_adjudication_2022_2024.csv"
      - "validation/model_v4_event_registry.csv"
      - "validation/model_v7_rainfall_baseline_result.json"
      - ".github/workflows/model-v7-development-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-v7-development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  development-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install modelling dependencies
        run: python -m pip install --disable-pip-version-check --quiet numpy scikit-learn xgboost
      - name: Train and evaluate V7 development candidate
        run: python validation/model_v7_development_candidate.py
