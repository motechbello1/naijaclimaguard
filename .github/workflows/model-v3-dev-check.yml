name: Model v3 Development Protocol Check

on:
  push:
    branches: [model-v3-dev]
    paths:
      - "validation/model_v3_dev.py"
      - "validation/model_v3_event_registry.csv"
      - "validation/model_v3_requirements.txt"
      - "validation/run_model_v3_dev.sh"
      - "validation/tests/test_model_v3_dev.py"
      - ".github/workflows/model-v3-dev-check.yml"
  pull_request:
    branches: [main, validation-v2]
    paths:
      - "validation/model_v3_dev.py"
      - "validation/model_v3_event_registry.csv"
      - "validation/model_v3_requirements.txt"
      - "validation/run_model_v3_dev.sh"
      - "validation/tests/test_model_v3_dev.py"
      - ".github/workflows/model-v3-dev-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen Model v3 environment
        run: |
          python -m pip install --upgrade pip
          pip install -r validation/model_v3_requirements.txt
      - name: Record exact runtime
        run: |
          python --version
          pip freeze | sort | tee model-v3-pip-freeze.txt
      - name: Compile Model v3 harness
        run: python -m py_compile validation/model_v3_dev.py
      - name: Run protocol guard tests
        run: python -m unittest validation/tests/test_model_v3_dev.py
      - name: Validate dedicated event registry gate
        run: |
          python - <<'PY'
          import pandas as pd
          p = 'validation/model_v3_event_registry.csv'
          e = pd.read_csv(p, parse_dates=['observed_by_date'])
          e = e[e['include_in_benchmark'].astype(str).str.lower().eq('true')]
          assert (e['observed_by_date'] < pd.Timestamp('2022-01-01')).all()
          assert e['event_id'].nunique() >= 15, e['event_id'].nunique()
          oof = e[e['observed_by_date'].dt.year.isin([2019, 2020, 2021])]
          assert oof['event_id'].nunique() >= 10, oof['event_id'].nunique()
          print('development events:', e['event_id'].nunique())
          print('2019-2021 OOF event anchors:', oof['event_id'].nunique())
          print(e.groupby(e['observed_by_date'].dt.year)['event_id'].nunique())
          PY
      - name: Upload runtime fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: model-v3-runtime-${{ github.run_number }}
          retention-days: 30
          path: model-v3-pip-freeze.txt
