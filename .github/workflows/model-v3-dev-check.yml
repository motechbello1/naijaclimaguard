name: Model v3 Development Protocol Check

on:
  push:
    branches: [model-v3-dev]
    paths:
      - "validation/model_v3_dev.py"
      - "validation/review_model_v3_results.py"
      - "validation/model_v3_event_registry.csv"
      - "validation/MODEL_V3_EVENT_REGISTRY_AUDIT.md"
      - "validation/MODEL_V3_PROTOCOL.md"
      - "validation/model_v3_requirements.txt"
      - "validation/model_v3_source_requirements.txt"
      - "validation/run_model_v3_dev.sh"
      - "validation/tests/test_model_v3_dev.py"
      - ".github/workflows/model-v3-dev-check.yml"
      - ".github/workflows/model-v3-full-development.yml"
  pull_request:
    branches: [main, validation-v2]
    paths:
      - "validation/model_v3_dev.py"
      - "validation/review_model_v3_results.py"
      - "validation/model_v3_event_registry.csv"
      - "validation/MODEL_V3_EVENT_REGISTRY_AUDIT.md"
      - "validation/MODEL_V3_PROTOCOL.md"
      - "validation/model_v3_requirements.txt"
      - "validation/model_v3_source_requirements.txt"
      - "validation/run_model_v3_dev.sh"
      - "validation/tests/test_model_v3_dev.py"
      - ".github/workflows/model-v3-dev-check.yml"
      - ".github/workflows/model-v3-full-development.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen Model v3 environment
        run: |
          python -m pip install --upgrade pip
          pip install -r validation/model_v3_requirements.txt
      - name: Record exact runtime
        run: |
          python --version
          pip freeze | sort | tee model-v3-pip-freeze.txt
      - name: Compile Model v3 harness and review
        run: |
          python -m py_compile validation/model_v3_dev.py
          python -m py_compile validation/review_model_v3_results.py
      - name: Run protocol guard tests
        run: python -m unittest validation/tests/test_model_v3_dev.py
      - name: Validate frozen development event registry
        run: |
          python - <<'PY'
          import pandas as pd
          p = 'validation/model_v3_event_registry.csv'
          e = pd.read_csv(p, parse_dates=['observed_by_date'])
          e = e[e['include_in_benchmark'].astype(str).str.lower().eq('true')]
          assert e['event_id'].is_unique
          assert (e['observed_by_date'] < pd.Timestamp('2022-01-01')).all()
          assert e['event_id'].nunique() == 16, e['event_id'].nunique()
          oof = e[e['observed_by_date'].dt.year.isin([2019, 2020, 2021])]
          assert oof['event_id'].nunique() == 12, oof['event_id'].nunique()
          expected_by_year = {2018: 4, 2019: 5, 2020: 4, 2021: 3}
          actual_by_year = e.groupby(e['observed_by_date'].dt.year)['event_id'].nunique().to_dict()
          assert actual_by_year == expected_by_year, actual_by_year
          print('development events:', e['event_id'].nunique())
          print('2019-2021 OOF event anchors:', oof['event_id'].nunique())
          print('events by year:', actual_by_year)
          PY
      - name: Verify full-development gate is still 2018-2021 only
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/model-v3-full-development.yml').read_text()
          assert 'START_DATE: "2018-01-01"' in text
          assert 'END_DATE: "2021-12-31"' in text
          assert 'HARD_CUTOFF: "2022-01-01"' in text
          assert 'validation_v2_canonical_confirmed' in text
          assert "event_id'].nunique() == 16" in text
          assert "oof['event_id'].nunique() == 12" in text
          print('full-development workflow cutoff and frozen-registry gates present')
          PY
      - name: Upload runtime fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: model-v3-runtime-${{ github.run_number }}
          retention-days: 30
          path: model-v3-pip-freeze.txt
