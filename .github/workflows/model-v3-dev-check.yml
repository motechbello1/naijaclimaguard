name: Model v3 Development Protocol Check

on:
  push:
    branches: [model-v3-dev]
    paths:
      - "validation/model_v3_dev.py"
      - "validation/review_model_v3_results.py"
      - "validation/select_model_v3_threshold.py"
      - "validation/fit_model_v3_freeze_candidate.py"
      - "validation/model_v3_event_registry.csv"
      - "validation/MODEL_V3_EVENT_REGISTRY_AUDIT.md"
      - "validation/MODEL_V3_PROTOCOL.md"
      - "validation/MODEL_V3_THRESHOLD_POLICY.md"
      - "validation/model_v3_requirements.txt"
      - "validation/model_v3_source_requirements.txt"
      - "validation/run_model_v3_dev.sh"
      - "validation/tests/test_model_v3_dev.py"
      - "validation/evidence/historical_benchmark_2018_2024.json"
      - ".github/workflows/model-v3-dev-check.yml"
      - ".github/workflows/model-v3-full-development.yml"
  pull_request:
    branches: [main, validation-v2]
    paths:
      - "validation/model_v3_dev.py"
      - "validation/review_model_v3_results.py"
      - "validation/select_model_v3_threshold.py"
      - "validation/fit_model_v3_freeze_candidate.py"
      - "validation/model_v3_event_registry.csv"
      - "validation/MODEL_V3_EVENT_REGISTRY_AUDIT.md"
      - "validation/MODEL_V3_PROTOCOL.md"
      - "validation/MODEL_V3_THRESHOLD_POLICY.md"
      - "validation/model_v3_requirements.txt"
      - "validation/model_v3_source_requirements.txt"
      - "validation/run_model_v3_dev.sh"
      - "validation/tests/test_model_v3_dev.py"
      - "validation/evidence/historical_benchmark_2018_2024.json"
      - ".github/workflows/model-v3-dev-check.yml"
      - ".github/workflows/model-v3-full-development.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen Model v3 environment
        run: |
          python -m pip install --upgrade pip
          pip install -r validation/model_v3_requirements.txt
      - name: Record exact runtime
        run: |
          python --version
          pip freeze | sort | tee model-v3-pip-freeze.txt
      - name: Compile Model v3 protocol code
        run: |
          python -m py_compile validation/model_v3_dev.py
          python -m py_compile validation/review_model_v3_results.py
          python -m py_compile validation/select_model_v3_threshold.py
          python -m py_compile validation/fit_model_v3_freeze_candidate.py
      - name: Run protocol guard tests
        run: python -m unittest validation/tests/test_model_v3_dev.py
      - name: Validate frozen development event registry
        run: |
          python - <<'PY'
          import pandas as pd
          e = pd.read_csv('validation/model_v3_event_registry.csv', parse_dates=['observed_by_date'])
          e = e[e['include_in_benchmark'].astype(str).str.lower().eq('true')]
          assert e['event_id'].is_unique
          assert (e['observed_by_date'] < pd.Timestamp('2022-01-01')).all()
          assert e['event_id'].nunique() == 16
          oof = e[e['observed_by_date'].dt.year.isin([2019, 2020, 2021])]
          assert oof['event_id'].nunique() == 12
          assert e.groupby(e['observed_by_date'].dt.year)['event_id'].nunique().to_dict() == {2018: 4, 2019: 5, 2020: 4, 2021: 3}
          PY
      - name: Validate canonical Validation v2 evidence gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('validation/evidence/historical_benchmark_2018_2024.json').read_text())
          assert r['status'] == 'historical_benchmark_complete_model_not_production_ready'
          assert r['data_qa']['fused_location_days'] == 12785
          assert r['protocol']['cutoff'] == '2022-01-01'
          assert r['protocol']['independent_feature_covered_train_events'] == 11
          assert r['protocol']['independent_test_events'] == 20
          t = r['chronological_test']
          assert abs(t['roc_auc'] - 0.7147814596462696) < 1e-12
          assert abs(t['pr_auc'] - 0.0572282380431264) < 1e-12
          assert t['event_detection_at_0_5'] == {'detected': 1, 'evaluated': 20, 'rate': 0.05}
          PY
      - name: Verify full-development and threshold gates
        run: |
          python - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/model-v3-full-development.yml').read_text()
          assert 'START_DATE: "2018-01-01"' in wf
          assert 'END_DATE: "2021-12-31"' in wf
          assert 'HARD_CUTOFF: "2022-01-01"' in wf
          assert 'Machine-verify canonical Validation v2 evidence' in wf
          assert 'select_model_v3_threshold.py' in wf
          assert 'fit_model_v3_freeze_candidate.py' in wf
          policy = Path('validation/MODEL_V3_THRESHOLD_POLICY.md').read_text()
          assert 'event-window detection rate >= 75%' in policy
          assert 'False-positive burden <= 10 per 1,000 negative location-days' in policy
          assert 'Precision >= 10%' in policy
          PY
      - name: Upload runtime fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: model-v3-runtime-${{ github.run_number }}
          retention-days: 30
          path: model-v3-pip-freeze.txt
