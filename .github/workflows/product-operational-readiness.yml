name: Product Operational Readiness Check

on:
  pull_request:
    paths:
      - "components/dashboard/**"
      - "app/dashboard/**"
      - "app/command/**"
      - "app/action/**"
      - "app/evidence/**"
      - "app/profile/**"
      - "lib/intelligence/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/product-operational-readiness.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
