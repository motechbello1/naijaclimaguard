name: Validation v2 PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - "validation/**"
      - ".github/workflows/validation-v2.yml"

permissions:
  contents: read

env:
  START_DATE: "2018-01-01"
  END_DATE: "2024-12-31"
  CUTOFF: "2022-01-01"
  EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
  EWDS_API_KEY: ${{ secrets.EWDS_API_KEY }}

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'validation-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout validation PR
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: validation/requirements.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r validation/requirements.txt

      - name: Credential preflight
        id: source_preflight
        shell: bash
        run: |
          test -n "$EARTHDATA_TOKEN" || { echo "EARTHDATA_TOKEN missing"; exit 1; }
          test -n "$EWDS_API_KEY" || { echo "EWDS_API_KEY missing"; exit 1; }
          echo "nasa=true" >> "$GITHUB_OUTPUT"
          echo "ewds=true" >> "$GITHUB_OUTPUT"
          echo "NASA and EWDS credentials detected."

      - name: Fetch GloFAS v4 historical discharge
        run: python validation/fetch_glofas.py --start "$START_DATE" --end "$END_DATE"

      - name: Compare GloFAS with Nigerian ground observations
        run: python validation/compare_glofas_ground.py

      - name: Fetch ERA5-Land surface state
        run: python validation/fetch_era5_land.py --start "$START_DATE" --end "$END_DATE"

      - name: Stream NASA GPM IMERG Final V07
        id: nasa_final
        continue-on-error: true
        run: python validation/fetch_nasa_imerg.py --start "$START_DATE" --end "$END_DATE" --batch-size 20

      - name: Check source coverage and provenance
        if: steps.nasa_final.outcome == 'success'
        run: python validation/check_sources.py --start "$START_DATE" --end "$END_DATE"

      - name: Build fused historical feature table
        if: steps.nasa_final.outcome == 'success'
        run: python validation/build_features.py

      - name: Run chronological independent-event benchmark
        id: benchmark
        if: steps.nasa_final.outcome == 'success'
        run: |
          python validation/validate_v2.py \
            --features validation/features_daily.csv \
            --events validation/event_registry.csv \
            --cutoff "$CUTOFF" \
            --threshold 0.50 \
            --output validation/validation_results.json

      - name: Stream NASA IMERG Early V06 for Lokoja 2022 operational replay
        id: nasa_early
        if: always()
        continue-on-error: true
        run: |
          python validation/fetch_nasa_imerg_early_2022.py \
            --start "2022-09-20T00:00:00Z" \
            --end "2022-10-07T23:59:59Z"

      - name: Fetch archived operational GloFAS forecasts for Lokoja 2022
        id: glofas_ops
        if: always()
        continue-on-error: true
        run: |
          python validation/fetch_glofas_operational_forecasts.py \
            --location Lokoja \
            --start 2022-09-21 \
            --end 2022-10-06 \
            --lead-hours 24 48 72

      - name: Build Lokoja 2022 operational replay evidence table
        id: lokoja_replay
        if: always() && steps.nasa_early.outcome == 'success' && steps.glofas_ops.outcome == 'success'
        run: python validation/reconstruct_lokoja_2022.py

      - name: Write validation status report
        if: always()
        shell: bash
        run: |
          {
            echo "Validation v2 execution status"
            echo "NASA IMERG Final: ${{ steps.nasa_final.outcome }}"
            echo "Historical XGBoost benchmark: ${{ steps.benchmark.outcome }}"
            echo "NASA IMERG Early replay source: ${{ steps.nasa_early.outcome }}"
            echo "GloFAS operational archive: ${{ steps.glofas_ops.outcome }}"
            echo "Lokoja combined replay: ${{ steps.lokoja_replay.outcome }}"
          } > validation/validation_status.txt

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-v2-evidence-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            validation/raw/*.csv
            validation/raw/glofas_operational_forecasts/*.nc
            validation/features_daily.csv
            validation/source_quality.json
            validation/validation_results.json
            validation/validation_status.txt
            validation/event_registry.csv
            validation/ground_observations.csv
            validation/glofas_ground_comparison.csv
            validation/glofas_ground_summary.json
            validation/nasa_imerg_early_lokoja_2022_halfhour.csv
            validation/nasa_imerg_early_lokoja_2022_daily.csv
            validation/glofas_operational_forecasts.csv
            validation/lokoja_2022_operational_replay.csv
            validation/lokoja_2022_operational_replay_summary.json
            validation/SOURCES.md
