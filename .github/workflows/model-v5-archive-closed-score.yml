name: Model v5 Archive-Closed Scientific Scoring

on:
  workflow_dispatch:
  push:
    branches: [model-v5-operational-native]
    paths:
      - ".github/workflows/model-v5-archive-closed-score.yml"
      - "validation/model_v5_archive_closed_score_trigger.txt"

permissions:
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  NASA_SOURCE_RUN_ID: "31292573245"
  MONTH_DIR: validation/model_v5/operational_archive_months

# This is the archive-closed replacement for source-acquisition execution.
# Sharing the source-access group prevents overlap with the older closure/full-run lanes.
concurrency:
  group: model-v5-ewds-source-access
  cancel-in-progress: true

jobs:
  score_archive_closed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: model-v5-operational-native
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: validation/model_v5_requirements.txt

      - name: Install pinned Model v5 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r validation/model_v5_requirements.txt
          python -m pip freeze > validation/model_v5_environment_freeze.txt

      - name: Verify frozen protocol, repaired parser and all 44 durable source packs
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          import pandas as pd

          protocol = Path('validation/MODEL_V5_OPERATIONAL_ARCHIVE_PROTOCOL.md').read_text(encoding='utf-8')
          parser = Path('validation/fetch_glofas_operational_archive_v5.py').read_text(encoding='utf-8')
          assert '2021-05-26' in protocol
          assert '2022, 2023 and 2024' in protocol
          assert 'Development rows are created only for issue dates actually retrieved' in protocol
          assert 'np.asarray(point.values).squeeze()' in parser

          with open('validation/model_v4_event_registry.csv', newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          enabled = [r for r in rows if str(r.get('include_in_benchmark','')).lower() == 'true']
          assert len({r.get('event_id') for r in enabled if r.get('event_id')}) == 35

          root = Path('validation/model_v5/operational_archive_months')
          expected = [(y,m) for y in range(2021,2025) for m in range(5 if y == 2021 else 1,13)]
          assert len(expected) == 44
          missing=[]; invalid=[]
          expected_contract = {
              'archive_start':'2021-05-26',
              'dataset':'cems-glofas-forecast',
              'hydrological_model':'lisflood',
              'lead_hours':[24,48,72],
              'product_type':'control_forecast',
              'system_version':'operational',
          }
          for y,m in expected:
              csvp = root / f'glofas_{y}_m{m:02d}.csv'
              manp = root / f'glofas_{y}_m{m:02d}.source_manifest.json'
              if not csvp.exists() or not manp.exists():
                  missing.append(f'{y}-{m:02d}')
                  continue
              try:
                  manifest = json.loads(manp.read_text(encoding='utf-8'))
                  df = pd.read_csv(csvp)
                  ok = (
                      manifest.get('source_contract') == expected_contract
                      and len(df) > 0
                      and int(manifest.get('output_rows',0)) == len(df)
                      and set(df['lead_time_hours'].unique()) == {24,48,72}
                      and df['location'].nunique() == 5
                      and float(manifest.get('coverage',0)) > 0
                  )
                  if not ok:
                      invalid.append(f'{y}-{m:02d}')
              except Exception:
                  invalid.append(f'{y}-{m:02d}')

          print(f'Provenance-valid durable months: {44-len(missing)-len(invalid)}/44')
          print('Missing:', missing)
          print('Invalid:', invalid)
          if missing or invalid:
              raise SystemExit('Archive-closed scoring blocked: durable source inventory is incomplete or invalid')
          print('All 44 archived-operational source packs validated. Synchronized >=90% dataset QA remains authoritative.')
          PY

      - name: Reuse preserved NASA source artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.NASA_SOURCE_RUN_ID }}
          pattern: model-v5-nasa-*
          path: validation/model_v5/work/nasa
          merge-multiple: true

      - name: Run frozen leakage and source-contract tests
        run: |
          python -m py_compile \
            validation/fetch_glofas_operational_archive_v5.py \
            validation/fetch_glofas_operational_archive_v5_batched.py \
            validation/build_model_v5_dataset.py \
            validation/model_v5_operational_archive.py \
            validation/freeze_model_v5_candidate.py
          python -m unittest discover -s validation/tests -p 'test_model_v5.py' -v

      - name: Build synchronized issue-time dataset and enforce authoritative >=90% source QA
        run: |
          python validation/build_model_v5_dataset.py \
            --nasa 'validation/model_v5/work/nasa/*.csv' \
            --glofas 'validation/model_v5/operational_archive_months/*.csv' \
            --events validation/model_v4_event_registry.csv \
            --start 2021-05-26 \
            --end 2024-12-31 \
            --out validation/model_v5_issue_dataset.csv \
            --manifest validation/model_v5_dataset_manifest.json

      - name: Score preregistered candidates and NASA/GloFAS ablations
        run: |
          python validation/model_v5_operational_archive.py \
            --dataset validation/model_v5_issue_dataset.csv \
            --events validation/model_v4_event_registry.csv \
            --output validation/model_v5_results.json \
            --scored-output validation/model_v5_oof_scored.csv

      - name: Apply unchanged frozen threshold and freeze gates
        run: |
          python validation/freeze_model_v5_candidate.py \
            --dataset validation/model_v5_issue_dataset.csv \
            --dataset-manifest validation/model_v5_dataset_manifest.json \
            --events validation/model_v4_event_registry.csv \
            --results validation/model_v5_results.json \
            --protocol validation/MODEL_V5_OPERATIONAL_ARCHIVE_PROTOCOL.md \
            --model-out validation/model_v5_freeze_candidate.joblib \
            --manifest-out validation/model_v5_freeze_manifest.json

      - name: Summarize authoritative scientific decision
        run: |
          python - <<'PY'
          import json
          r=json.load(open('validation/model_v5_results.json'))
          f=json.load(open('validation/model_v5_freeze_manifest.json'))
          m=r['selected_candidate_metrics']['pooled_oof_metrics']
          print('STATUS:', r['status'])
          print('WINNER:', r['selected_candidate'])
          print('POOLED PR-AUC:', m['pr_auc'])
          print('POOLED ROC-AUC:', m['roc_auc'])
          print('POOLED BRIER:', m['brier_score'])
          print('THRESHOLD:', r['threshold_policy']['chosen_threshold'])
          print('FREEZE:', f['status'])
          if f['status'] == 'freeze_blocked':
              print('BLOCKERS:', f.get('blockers'))
          PY

      - name: Commit synchronized development decision to exact branch
        run: |
          git config user.name "naijaclimaguard-model-v5-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            validation/model_v5_dataset_manifest.json \
            validation/model_v5_results.json \
            validation/model_v5_freeze_manifest.json \
            validation/model_v5_environment_freeze.txt
          git diff --cached --quiet && exit 0
          git commit -m "model-v5: preserve archive-closed synchronized decision ${GITHUB_RUN_ID}"
          git pull --rebase origin model-v5-operational-native
          git push origin HEAD:model-v5-operational-native

      - name: Upload authoritative scientific evidence
        uses: actions/upload-artifact@v4
        with:
          name: model-v5-archive-closed-final-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            validation/model_v5_issue_dataset.csv
            validation/model_v5_dataset_manifest.json
            validation/model_v5_results.json
            validation/model_v5_oof_scored.csv
            validation/model_v5_freeze_manifest.json
            validation/model_v5_freeze_candidate.joblib
            validation/model_v5_environment_freeze.txt
