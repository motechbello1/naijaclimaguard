name: Model V7-D Hybrid Confirmation

on:
  push:
    branches: [competition-model-v7-no-approval]
    paths:
      - "validation/model_v7_hybrid_confirmation.py"
      - "validation/model_v7_spatial_candidate.py"
      - "validation/model_v7_decision_policy_experiment.py"
      - "validation/model_v7_development_candidate.py"
      - "validation/model_v7_event_registry_candidates.csv"
      - "validation/model_v7_event_location_adjudication.csv"
      - ".github/workflows/model-v7-hybrid-confirmation.yml"
  pull_request:
    branches: [main]
    paths:
      - "validation/model_v7_hybrid_confirmation.py"
      - "validation/model_v7_spatial_candidate.py"
      - "validation/model_v7_decision_policy_experiment.py"
      - "validation/model_v7_development_candidate.py"
      - "validation/model_v7_event_registry_candidates.csv"
      - "validation/model_v7_event_location_adjudication.csv"
      - ".github/workflows/model-v7-hybrid-confirmation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-v7-d-hybrid-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hybrid-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install modelling dependencies
        run: python -m pip install --disable-pip-version-check --quiet numpy scikit-learn xgboost
      - name: Run V7-D hybrid confirmation experiment
        run: python validation/model_v7_hybrid_confirmation.py
      - name: Verify final holdout remained untouched
        run: |
          python - <<'PY'
          import json
          p='validation/model_v7_hybrid_confirmation_result.json'
          r=json.load(open(p, encoding='utf-8'))
          assert r['holdout_2026_queried'] is False
          assert r['guardrails']['max_query_year'] == 2025
          assert r['guardrails']['2026_holdout_queried'] is False
          assert r['guardrails']['selection_uses_2024_only'] is True
          assert r['guardrails']['detector_frozen_from_v7_b'] is True
          print('V7-D passed holdout and detector-freeze guardrails.')
          PY
      - name: Upload V7-D development evidence
        uses: actions/upload-artifact@v4
        with:
          name: model-v7-d-hybrid-${{ github.run_id }}
          path: validation/model_v7_hybrid_confirmation_result.json
          retention-days: 90
