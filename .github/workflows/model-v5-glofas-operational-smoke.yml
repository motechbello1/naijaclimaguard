name: Model v5 GloFAS Operational Archive Smoke

on:
  push:
    branches: [model-v5-operational-native]
    paths:
      - "validation/model_v5_glofas_operational_smoke_trigger.txt"
      - ".github/workflows/model-v5-glofas-operational-smoke.yml"
      - "validation/fetch_glofas_operational_archive_v5.py"

permissions:
  contents: read

env:
  EWDS_API_KEY: ${{ secrets.EWDS_API_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  era-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - year: 2020
            date: "2020-04-01"
            expected_system: "version_2_1"
            expected_hydrological_model: "htessel_lisflood"
          - year: 2022
            date: "2022-09-21"
            expected_system: "version_3_1"
            expected_hydrological_model: "lisflood"
          - year: 2024
            date: "2024-07-04"
            expected_system: "operational"
            expected_hydrological_model: "lisflood"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: validation/model_v5_requirements.txt
      - name: Install Model v5 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r validation/model_v5_requirements.txt
      - name: Verify EWDS credential
        run: test -n "$EWDS_API_KEY" || (echo 'EWDS_API_KEY missing' && exit 1)
      - name: Fetch one archived operational issue date
        run: |
          python validation/fetch_glofas_operational_archive_v5.py \
            --year "${{ matrix.year }}" \
            --dates "${{ matrix.date }}" \
            --lead-hours 24 48 72 \
            --raw-dir "validation/model_v5/smoke/glofas_raw_${{ matrix.year }}" \
            --out "validation/model_v5/smoke/glofas_${{ matrix.year }}.csv"
      - name: Validate era contract and extracted output
        run: |
          python - <<'PY'
          import pandas as pd
          year = "${{ matrix.year }}"
          date = "${{ matrix.date }}"
          expected_system = "${{ matrix.expected_system }}"
          expected_model = "${{ matrix.expected_hydrological_model }}"
          df = pd.read_csv(f"validation/model_v5/smoke/glofas_{year}.csv")
          assert len(df) == 15, f"expected 15 rows, got {len(df)}"
          assert sorted(df['lead_time_hours'].astype(int).unique().tolist()) == [24, 48, 72]
          assert df['location'].nunique() == 5
          assert sorted(df['issue_date'].astype(str).unique().tolist()) == [date]
          assert sorted(df['system_version_request'].unique().tolist()) == [expected_system]
          assert sorted(df['hydrological_model'].unique().tolist()) == [expected_model]
          print({
              'status': 'pass',
              'date': date,
              'rows': len(df),
              'system_version': expected_system,
              'hydrological_model': expected_model,
              'locations': sorted(df['location'].unique().tolist()),
              'lead_hours': sorted(df['lead_time_hours'].astype(int).unique().tolist()),
          })
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: model-v5-glofas-era-smoke-${{ matrix.year }}
          retention-days: 30
          path: validation/model_v5/smoke/glofas_${{ matrix.year }}.csv
          if-no-files-found: error
