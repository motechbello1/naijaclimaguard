name: Model v3 Full Development — 2018-2021 Only

on:
  workflow_dispatch:
  push:
    branches: [model-v3-dev]
    paths:
      - "validation/model_v3_full_run_trigger.txt"

permissions:
  contents: read

env:
  START_DATE: "2018-01-01"
  END_DATE: "2021-12-31"
  HARD_CUTOFF: "2022-01-01"
  EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout Model v3 branch
        uses: actions/checkout@v4

      - name: Machine-verify canonical Validation v2 evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('validation/evidence/historical_benchmark_2018_2024.json')
          assert p.exists(), 'Canonical Validation v2 evidence file is missing'
          r = json.loads(p.read_text())
          assert r['status'] == 'historical_benchmark_complete_model_not_production_ready'
          assert r['data_qa']['fused_location_days'] == 12785
          assert r['data_qa']['date_start'] == '2018-01-01'
          assert r['data_qa']['date_end'] == '2024-12-31'
          assert r['protocol']['cutoff'] == '2022-01-01'
          assert r['protocol']['independent_feature_covered_train_events'] == 11
          assert r['protocol']['independent_test_events'] == 20
          t = r['chronological_test']
          assert abs(t['roc_auc'] - 0.7147814596462696) < 1e-12
          assert abs(t['pr_auc'] - 0.0572282380431264) < 1e-12
          assert t['confusion_matrix'] == {'tn': 4890, 'fp': 29, 'fn': 97, 'tp': 3}
          assert t['event_detection_at_0_5'] == {'detected': 1, 'evaluated': 20, 'rate': 0.05}
          assert r['features']['top_gain_features_diagnostic'][:2] == ['day_of_year', 'month']
          print('Canonical Validation v2 benchmark verified from committed evidence.')
          print('ROC-AUC:', t['roc_auc'])
          print('PR-AUC:', t['pr_auc'])
          print('Event detection:', t['event_detection_at_0_5'])
          PY

      - name: Set up frozen Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            validation/model_v3_requirements.txt
            validation/model_v3_source_requirements.txt

      - name: Install frozen development and ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r validation/model_v3_requirements.txt -r validation/model_v3_source_requirements.txt

      - name: Record runtime before data access
        run: |
          python --version | tee model-v3-python-version.txt
          pip freeze | sort | tee model-v3-full-pip-freeze.txt

      - name: Require NASA Earthdata credential
        run: |
          test -n "$EARTHDATA_TOKEN" || {
            echo "EARTHDATA_TOKEN is required for the frozen IMERG source."
            exit 1
          }

      - name: Fetch 2018-2021 GloFAS historical discharge only
        run: python validation/fetch_glofas.py --start "$START_DATE" --end "$END_DATE"

      - name: Fetch 2018-2021 ERA5-Land surface state only
        run: python validation/fetch_era5_land.py --start "$START_DATE" --end "$END_DATE"

      - name: Fetch 2018-2021 NASA GPM IMERG Final V07 only
        run: python validation/fetch_nasa_imerg.py --start "$START_DATE" --end "$END_DATE" --batch-size 20

      - name: Check fixed development source coverage and provenance
        run: python validation/check_sources.py --start "$START_DATE" --end "$END_DATE"

      - name: Build fused development features
        run: python validation/build_features.py

      - name: Enforce zero post-cutoff feature leakage
        run: |
          python - <<'PY'
          import pandas as pd
          p = 'validation/features_daily.csv'
          d = pd.read_csv(p, parse_dates=['date'])
          cutoff = pd.Timestamp('2022-01-01')
          assert not d.empty
          assert (d['date'] < cutoff).all(), d.loc[d['date'] >= cutoff, ['date','location']].head()
          assert d['date'].min() >= pd.Timestamp('2018-01-01')
          assert d['date'].max() <= pd.Timestamp('2021-12-31')
          assert d['location'].nunique() == 5, d['location'].unique()
          print('feature rows:', len(d))
          print('date range:', d['date'].min().date(), 'to', d['date'].max().date())
          print('locations:', sorted(d['location'].unique()))
          PY

      - name: Enforce frozen Model v3 event registry
        run: |
          python - <<'PY'
          import pandas as pd
          p = 'validation/model_v3_event_registry.csv'
          e = pd.read_csv(p, parse_dates=['observed_by_date'])
          e = e[e['include_in_benchmark'].astype(str).str.lower().eq('true')]
          assert e['event_id'].is_unique
          assert (e['observed_by_date'] < pd.Timestamp('2022-01-01')).all()
          assert e['event_id'].nunique() == 16, e['event_id'].nunique()
          oof = e[e['observed_by_date'].dt.year.isin([2019, 2020, 2021])]
          assert oof['event_id'].nunique() == 12, oof['event_id'].nunique()
          expected_by_year = {2018: 4, 2019: 5, 2020: 4, 2021: 3}
          actual_by_year = e.groupby(e['observed_by_date'].dt.year)['event_id'].nunique().to_dict()
          assert actual_by_year == expected_by_year, actual_by_year
          print('development events:', e['event_id'].nunique())
          print('OOF events:', oof['event_id'].nunique())
          print('events by year:', actual_by_year)
          PY

      - name: Run Model v3 development candidates
        run: bash validation/run_model_v3_dev.sh

      - name: Validate development result safety gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('validation/model_v3_development_results.json').read_text())
          assert r['status'] == 'development_only_not_production_validated'
          assert r['hard_development_cutoff'] == '2022-01-01'
          assert r['production']['engine_remains'] == 'derived-v2'
          assert r['production']['model_v3_deployed'] is False
          assert r['freeze_gate']['ready_to_freeze_for_new_holdout'] is False
          assert r['data']['development_events'] == 16
          assert r['data']['oof_event_anchors'] == 12
          selected = r['selected_candidate']
          assert selected['threshold_status'] == 'provisional_oof_f1_diagnostic_not_operational_policy'
          assert selected['calendar_features_allowed_in_winner'] is False
          assert len(selected['threshold_frontier']) == 19
          expected_locations = {'Lokoja', 'Makurdi', 'Onitsha', 'Yenagoa', 'Hadejia'}
          assert set(selected['per_location_at_provisional_threshold']) == expected_locations
          print('selected development candidate:', selected['candidate'])
          print('provisional diagnostic threshold:', selected['development_threshold'])
          print('mean temporal-fold PR-AUC:', selected['mean_fold_pr_auc'])
          PY

      - name: Run scientific sanity review
        run: |
          python validation/review_model_v3_results.py \
            --results validation/model_v3_development_results.json \
            --output validation/model_v3_scientific_review.json

      - name: Apply predeclared threshold policy
        run: |
          python validation/select_model_v3_threshold.py \
            --results validation/model_v3_development_results.json \
            --review validation/model_v3_scientific_review.json \
            --output validation/model_v3_threshold_decision.json

      - name: Fit freeze candidate only if every development gate passes
        run: |
          python validation/fit_model_v3_freeze_candidate.py \
            --features validation/features_daily.csv \
            --events validation/model_v3_event_registry.csv \
            --results validation/model_v3_development_results.json \
            --review validation/model_v3_scientific_review.json \
            --threshold-decision validation/model_v3_threshold_decision.json \
            --artifact validation/model_v3_freeze_candidate.joblib \
            --manifest validation/model_v3_freeze_manifest.json

      - name: Summarize development / freeze decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          review = json.loads(Path('validation/model_v3_scientific_review.json').read_text())
          threshold = json.loads(Path('validation/model_v3_threshold_decision.json').read_text())
          freeze = json.loads(Path('validation/model_v3_freeze_manifest.json').read_text())
          print('minimum scientific sanity pass:', review['minimum_scientific_sanity_pass'])
          print('threshold decision:', threshold['status'])
          print('chosen threshold:', threshold['chosen_threshold'])
          print('freeze status:', freeze['status'])
          print('ready for new untouched holdout:', freeze['ready_for_new_untouched_holdout'])
          for blocker in freeze.get('blockers', []):
              print('BLOCKER:', blocker)
          PY

      - name: Write immutable development status
        run: |
          {
            echo "Model v3 full development run"
            echo "Canonical Validation v2 gate: machine-verified committed evidence"
            echo "Development period: 2018-01-01 through 2021-12-31"
            echo "Hard cutoff: 2022-01-01"
            echo "Frozen development events: 16"
            echo "Frozen OOF event anchors: 12"
            echo "Threshold policy: predeclared 75% event detection / <=10 FP location-days per 1000 negatives / >=10% precision"
            echo "Production engine remains: derived-v2"
            echo "Model v3 deployment: false"
            echo "Commit: $GITHUB_SHA"
          } > validation/model_v3_development_status.txt

      - name: Upload Model v3 development and freeze evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-v3-development-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            model-v3-python-version.txt
            model-v3-full-pip-freeze.txt
            validation/raw/nasa_imerg_daily.csv
            validation/raw/glofas_daily.csv
            validation/raw/era5_land_daily.csv
            validation/features_daily.csv
            validation/source_quality.json
            validation/evidence/historical_benchmark_2018_2024.json
            validation/model_v3_event_registry.csv
            validation/MODEL_V3_EVENT_REGISTRY_AUDIT.md
            validation/MODEL_V3_PROTOCOL.md
            validation/MODEL_V3_THRESHOLD_POLICY.md
            validation/model_v3_requirements.txt
            validation/model_v3_source_requirements.txt
            validation/model_v3_development_results.json
            validation/model_v3_scientific_review.json
            validation/model_v3_threshold_decision.json
            validation/model_v3_freeze_manifest.json
            validation/model_v3_freeze_candidate.joblib
            validation/model_v3_development_status.txt
