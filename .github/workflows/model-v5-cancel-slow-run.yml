name: Cancel superseded Model v5 run

on:
  push:
    branches: [model-v5-operational-native]
    paths:
      - ".github/workflows/model-v5-cancel-slow-run.yml"
      - "validation/model_v5_cancel_slow_run_trigger.txt"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded sequential full run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: "31308590298"
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.error
          url = f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}/cancel"
          req = urllib.request.Request(url, method='POST', headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'naijaclimaguard-model-v5-cancel',
          })
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  print('cancel status', response.status)
          except urllib.error.HTTPError as exc:
              if exc.code == 409:
                  print('run already completed/cancelled; nothing to do')
              else:
                  raise
          PY
