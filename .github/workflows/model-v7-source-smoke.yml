name: Model V7 Source Smoke

on:
  push:
    branches: [competition-model-v7-no-approval]
    paths:
      - "validation/model_v7_source_smoke.py"
      - "validation/model_v7_history_coverage_probe.py"
      - "validation/model_v7_feature_availability_probe.py"
      - "validation/model_v7_rainfall_baseline.py"
      - "validation/model_v7_rainfall_baseline_robust.py"
      - "validation/model_v7_event_registry_candidates.csv"
      - "validation/model_v7_event_location_adjudication.csv"
      - "validation/model_v7_final_holdout_candidates_2026.csv"
      - "validation/MODEL_V7_COMPETITION_PROTOCOL.md"
      - ".github/workflows/model-v7-source-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "validation/model_v7_source_smoke.py"
      - "validation/model_v7_history_coverage_probe.py"
      - "validation/model_v7_feature_availability_probe.py"
      - "validation/model_v7_rainfall_baseline.py"
      - "validation/model_v7_rainfall_baseline_robust.py"
      - "validation/model_v7_event_registry_candidates.csv"
      - "validation/model_v7_event_location_adjudication.csv"
      - "validation/model_v7_final_holdout_candidates_2026.csv"
      - "validation/MODEL_V7_COMPETITION_PROTOCOL.md"
      - ".github/workflows/model-v7-source-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-v7-source-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify historical and fixed-lead forecast sources
        run: python validation/model_v7_source_smoke.py
      - name: Probe fixed-lead archive coverage
        run: python validation/model_v7_history_coverage_probe.py
      - name: Probe richer development-only features
        run: python validation/model_v7_feature_availability_probe.py
      - name: Run rainfall-only baseline benchmark
        run: python validation/model_v7_rainfall_baseline_robust.py
